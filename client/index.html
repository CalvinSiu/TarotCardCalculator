<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarot Birth Card Calculator</title>
    <meta name="description" content="Find the tarot birth cards for any date and read what the pairing means.">
    <link rel="stylesheet" href="css/main.css">
    <script type="module" src="js/main.js"></script>
</head>
<body>
    <main>
        <h1>The Tarot Birth Card Calculator</h1>

        <p class="intro">
            Every person is given at least two tarot cards based on their birth date.
            Enter yours below to find out which cards you were dealt and what the pairing means.
            Select any card to read what it means on its own.
        </p>

        <p id="source-note" class="notice" hidden></p>

        <div id="cards" class="card-row"></div>

        <p id="math" class="math" aria-live="polite"></p>

        <form id="birth-form" novalidate>
            <div class="field">
                <label for="month">Month</label>
                <select id="month" name="month">
                    <option value="1">January</option>
                    <option value="2">February</option>
                    <option value="3">March</option>
                    <option value="4">April</option>
                    <option value="5">May</option>
                    <option value="6">June</option>
                    <option value="7">July</option>
                    <option value="8">August</option>
                    <option value="9">September</option>
                    <option value="10">October</option>
                    <option value="11">November</option>
                    <option value="12">December</option>
                </select>
            </div>

            <div class="field">
                <label for="day">Day</label>
                <input type="number" id="day" name="day" min="1" max="31" inputmode="numeric" placeholder="4">
            </div>

            <div class="field">
                <label for="year">Year</label>
                <input type="number" id="year" name="year" min="1000" max="9999" inputmode="numeric" placeholder="2002">
            </div>

            <div class="actions">
                <button type="submit" class="primary">Calculate</button>
                <button type="button" id="reset">Reset</button>
            </div>
        </form>

        <p id="error" class="error" role="alert" hidden></p>

        <section class="readout">
            <p id="pairing" aria-live="polite"></p>
            <p id="detail" class="detail" aria-live="polite"></p>
        </section>
    </main>
</body>
</html>
